capability_id: pathology_lazyslide
kind: agent
package: lazyslide
source: https://github.com/RendeiroLab/LazySlide.git
docs: https://lazyslide.readthedocs.io/en/latest/
notebooks: []
cost_profile: moderate
python_env: omicdev
r_env: CMAP
splits:
  train_ratio: 0.2
  selection_ratio: 0.1
  test_ratio: 0.7
optimizer:
  epochs: 4
  rollout_batch_size_B: 40
  minibatch_size_Bm: 8
  edit_budget_Lt: 4
  lr_schedule: constant
  lr_floor: 2
  slow_update_samples: 20
  meta_skill_enabled: true
quality:
  pass_threshold: 75
  hard_gate_min: 3
domain: spatial-he
title: Pathology — LazySlide (H&E whole-slide analysis omni-agent)
owns_skills:
- pathology-lazyslide-he-analysis
- pathology-lazyslide-cell-segmentation
- pathology-lazyslide-supervised-classification
- pathology-lazyslide-survival-prediction
- pathology-lazyslide-he-transcriptomics-integration
- pathology-lazyslide-virtual-staining
bundle_rationale: lazyslide is a third-party H&E WSI analysis package. Per OmicVerse
  precedent (omicverse_omni), an external package gets ONE OmicOS agent that dispatches
  between its sub-capabilities based on the user's intent. This avoids agent proliferation
  (6 nearly-identical use_when blocks would be redundant), keeps a single front-door
  for 'I want to do X with H&E using lazyslide', and matches how OmicOS already surfaces
  ecosystems.
