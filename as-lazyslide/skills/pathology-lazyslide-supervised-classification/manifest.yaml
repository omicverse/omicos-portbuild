capability_id: pathology-lazyslide-supervised-classification
kind: skill
package: lazyslide
source: https://github.com/RendeiroLab/LazySlide.git
docs: https://lazyslide.readthedocs.io/en/latest/
notebooks:
- Integration with slide-level labels
cost_profile: gpu-required
python_env: omicdev
r_env: CMAP
splits:
  train_ratio: 0.2
  selection_ratio: 0.1
  test_ratio: 0.7
optimizer:
  epochs: 4
  rollout_batch_size_B: 40
  minibatch_size_Bm: 8
  edit_budget_Lt: 4
  lr_schedule: constant
  lr_floor: 2
  slow_update_samples: 20
  meta_skill_enabled: true
quality:
  pass_threshold: 75
  hard_gate_min: 3
domain: spatial-he
title: Slide-level supervised classification with known H&E labels
key_modules:
- lazyslide.preprocess
- lazyslide.tools
- lazyslide.metrics
key_apis:
- name: lazyslide.tools.feature_extraction
  purpose: tile-level FM features
- name: lazyslide.tools.feature_aggregation(encoder='mean'|'prism'|'titan')
  purpose: slide-level embedding
- name: wsidata.agg_wsi
  purpose: stack per-slide features into labeled cohort
- name: sklearn / torch head
  purpose: downstream supervised classifier (not lazyslide-native)
distinct_from: Requires KNOWN slide-level labels as supervision; outputs trained classifier
  + per-slide predictions.
