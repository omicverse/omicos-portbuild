capability_id: pathology-lazyslide-he-analysis
kind: skill
package: lazyslide
source: https://github.com/RendeiroLab/LazySlide.git
docs: https://lazyslide.readthedocs.io/en/latest/
notebooks:
- Preprocessing a WSI
- Feature extraction and spatial analysis
- Zero-shot learning
- Approximate segmentation through tile prediction
- Histology tile generation
cost_profile: gpu-required
python_env: omicdev
r_env: CMAP
splits:
  train_ratio: 0.2
  selection_ratio: 0.1
  test_ratio: 0.7
optimizer:
  epochs: 4
  rollout_batch_size_B: 40
  minibatch_size_Bm: 8
  edit_budget_Lt: 4
  lr_schedule: constant
  lr_floor: 2
  slow_update_samples: 20
  meta_skill_enabled: true
quality:
  pass_threshold: 75
  hard_gate_min: 3
domain: spatial-he
title: Direct H&E whole-slide morphology pipeline with LazySlide
key_modules:
- lazyslide.preprocess
- lazyslide.tools
- lazyslide.plotting
- lazyslide.metrics
key_apis:
- name: wsidata.open_wsi
  purpose: load WSI to WSIData (SpatialData subclass)
- name: lazyslide.preprocess.find_tissues
  purpose: tissue mask to wsi.shapes['tissues']
- name: lazyslide.preprocess.tile_tissues
  purpose: tile generation
- name: lazyslide.tools.feature_extraction
  purpose: FM tile features
- name: lazyslide.tools.feature_aggregation
  purpose: per-tile to slide-level
- name: lazyslide.tools.zero_shot_score + tools.text_image_similarity
  purpose: zero-shot tile typing
distinct_from: Outputs tissue + tile geometry + tile FM features + optional zero-shot
  probs. Does NOT produce cell-level shapes, molecular predictions, slide-level supervised
  labels, survival times, or generated images.
